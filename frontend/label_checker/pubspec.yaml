name: label_checker
description: "Label Compliance Checker — Verify product labels against Legal Metrology Rules, 2011"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Camera & Image
  image_picker: ^1.1.2
  camera: ^0.11.0+2

  # Networking
  dio: ^5.7.0

  # State Management
  provider: ^6.1.2

  # UI
  google_fonts: ^6.2.1
  lottie: ^3.1.3
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0

  # Utilities
  intl: ^0.19.0
  share_plus: ^10.1.3
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/images/
